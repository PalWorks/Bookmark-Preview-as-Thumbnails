name = "thumbnail-bookmarks-feedback"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "96ec2a311affbd387b884673c0e84eb8"

# Served on bookmarks-feedback.palworks.ai and workers.dev. Preview URLs are off: two addresses are enough
# surface for an unauthenticated form.
workers_dev = true
preview_urls = false

# Custom domain on palworks.ai (attached 2026-11-10). It adds one hostname to this Worker and
# touches no other Worker or DNS record on the account. workers.dev stays on so copies of the
# extension that still use the old address keep working.
routes = [{ pattern = "bookmarks-feedback.palworks.ai", custom_domain = true }]

# Required: without them every POST /feedback fails.
[vars]
FEEDBACK_FROM = "Visual Bookmark Manager feedback <feedback.ThumbnailBookmarks@palworks.ai>"
FEEDBACK_TO = "support@palworks.ai"
# Usage statistics (D27): the GA4 web stream "Chrome extension" in the property that also
# measures the website. Its API secret, and the PostHog project key, are Worker secrets
# (GA4_API_SECRET, POSTHOG_KEY); without them /events accepts and drops.
GA4_MEASUREMENT_ID = "G-Y7EQS9EYQB"
POSTHOG_HOST = "https://eu.i.posthog.com"
# Only these pages may post: the Web Store build, then the maintainer's unpacked build.
# Add your own unpacked extension id here to test the form from a development build.
ALLOWED_ORIGINS = "chrome-extension://eedekafhclngkhhkcocblnllkbodgnhj,chrome-extension://pinepbhghhkcpnjmkohlfnipldbgcogm"

# Rate-limit counters only, in one Durable Object (src/limiter.ts): exact counts,
# named by an HMAC of the network and never the address; none outlives 26 hours.
# Replaced the KV counters on 2026-11-09 (review of PR #11: KV is not atomic).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "FeedbackLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedbackLimiter"]

# Burst limit per network, per data centre, approximate by design. `period`
# may only be 10 or 60. The Durable Object limiter above is the real ceiling and the
# fallback if this binding is missing or fails. Namespace ids on this account:
# 2001 website contact worker, 2002 Gmail Labels as Tabs feedback, 2003 this one.
[[ratelimits]]
name = "BURST"
namespace_id = "2003"
simple = { limit = 3, period = 60 }

# Usage statistics: at most 60 batches a minute per network, per data centre. 2310 keeps
# clear of the namespace ids listed above.
[[ratelimits]]
name = "EVENTS_BURST"
namespace_id = "2310"
simple = { limit = 60, period = 60 }
