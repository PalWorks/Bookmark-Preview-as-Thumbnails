name: Extension CI

# Kept to the minimum on purpose (owner, 2026-11-09): one job, pull requests only,
# and only when code changes. Docs-only pull requests do not run CI; the same checks
# run locally before every push (npm run lint, npm test -- --run, npm run build,
# npm run check:bundle, npm run e2e). Run it by hand from the Actions tab if needed.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "bridge/**"
      - "*.json"
      - "*.ts"
      - "*.js"
      - "*.html"
      - ".github/workflows/extension-ci.yml"
  workflow_dispatch:

# A newer push to the same pull request cancels the run still in progress.
concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 (22.18 or later) also runs the worker tests with type stripping.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      # The feedback relay (worker/) has its own package and tsconfig.
      - name: Feedback worker tests and typecheck
        working-directory: worker
        run: |
          npm ci
          node --test test/index.test.ts
          npm run typecheck

      # The coding-agent helper (bridge/): host, MCP server and CLI, tested as real processes.
      - name: Bridge package tests and typecheck
        working-directory: bridge
        run: |
          node build.mjs
          node --test test/*.test.ts
          ../node_modules/.bin/tsc -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Check bundle (service worker hygiene, no secrets or source maps)
        run: npm run check:bundle

      - name: Smoke test in headless Chrome
        env:
          E2E_NO_SANDBOX: "1"
        run: google-chrome --version && npm run e2e

      - name: Bridge end to end in headless Chrome
        env:
          E2E_NO_SANDBOX: "1"
        run: node scripts/e2e/bridge.mjs dist bridge/dist/cli.js
