name: Extension CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "scripts/**"
      - "*.json"
      - "*.ts"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      # The feedback relay (worker/) is the only server-side code and has its own
      # package and tsconfig. Its tests run on plain Node with type stripping,
      # which needs Node 22.18 or later.
      - name: Feedback worker tests and typecheck
        working-directory: worker
        run: |
          npm ci
          npx --yes node@22.18 --test test/index.test.ts
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Check bundle (service worker hygiene, no secrets or source maps)
        run: npm run check:bundle

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  e2e:
    name: Real-Chrome smoke test
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test in headless Chrome
        env:
          E2E_NO_SANDBOX: "1"
        run: google-chrome --version && npm run e2e
